[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  # ==========================================
# CACHE PWA / AGGIORNAMENTI
# ==========================================

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
framework = "vite"
targetPort = 5173
port = 8888
envFiles = [".env"]


# Redirect API -> Functions (vale sia in dev che in prod)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

 [[scheduled]]
  name = "update-classifica"
  cron = "0 21 * * *"
  path = "/.netlify/functions/update-classifica"

  [[scheduled]]
  name = "update-classifica"
  cron = "0 21 * * *"
  path = "/.netlify/functions/update-classifica"

[[scheduled]]
  name = "update-partite-classifica"
  cron = "5 21 * * *"
  path = "/.netlify/functions/update-partite-classifica"

